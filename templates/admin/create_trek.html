{% extends 'base.html' %}
{% block title %}New Trek{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width:640px">
  <h2 class="mb-4">Create Trek</h2>
  <form method="POST">
    <div class="mb-3"><label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Location</label>
      <input type="text" name="location" class="form-control" required></div>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label">Difficulty</label>
        <select name="difficulty" class="form-select" required>
          <option value="Easy">Easy</option><option value="Moderate">Moderate</option><option value="Hard">Hard</option>
        </select></div>
      <div class="col-md-6 mb-3"><label class="form-label">Duration (days)</label>
        <input type="number" name="duration_days" class="form-control" min="1" required></div>
    </div>
    <div class="mb-3"><label class="form-label">Total slots</label>
      <input type="number" name="slots" class="form-control" min="1" required></div>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label">Start date</label>
        <input type="date" name="start_date" class="form-control" required></div>
      <div class="col-md-6 mb-3"><label class="form-label">End date</label>
        <input type="date" name="end_date" class="form-control" required></div>
    </div>
    <div class="mb-3"><label class="form-label">Description</label>
      <textarea name="description" class="form-control" rows="3"></textarea></div>
    <button type="submit" class="btn btn-success">Create Trek</button>
    <a href="{{ url_for('admin_treks') }}" class="btn btn-link">Cancel</a>
  </form>
  <a href='{{ url_for("admin_dashboard") }}' class='btn btn-outline-secondary'> ← Back to dashboard</a>
</div>
{% endblock %}
