{% extends 'base.html' %}
{% block title %}Edit Trek{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width:640px">
  <h2 class="mb-4">Edit Trek</h2>
  <form method="POST">
    <div class="mb-3"><label class="form-label">Name</label>
      <input type="text" name="name" class="form-control" value="{{trek.name}}" required></div>
    <div class="mb-3"><label class="form-label">Location</label>
      <input type="text" name="location" class="form-control" value="{{trek.location}}" required></div>
    <div class="row">
      <div class="col-md-6 mb-3"><label class="form-label">Difficulty</label>
        <select name="difficulty" class="form-select">
          {% for d in ['Easy','Moderate','Hard'] %}
          <option value="{{ d }}" {% if trek.difficulty == d %}selected{% endif %}>{{ d }}</option>
          {% endfor %}
        </select></div>
      <div class="col-md-6 mb-3"><label class="form-label">Available slots</label>
        <input type="number" name="slots" class="form-control" value="{{ trek.available_slots }}" min="0" required></div>
    </div>
    <div class="mb-3"><label class="form-label">Status</label>
      <select name="status" class="form-select">
        {% for s in allowed_statuses %}
        <option value="{{ s }}" {% if trek.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select></div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('admin_treks') }}" class="btn btn-link">Cancel</a>
  </form>
  <a href='{{ url_for("admin_dashboard") }}' class='btn btn-outline-secondary'> ← Back to dashboard</a>
</div>
{% endblock %}
