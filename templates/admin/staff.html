{% extends 'base.html' %}
{% block title %}Manage Staff{% endblock %}
{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Manage Staff</h2>
    <a href="{{ url_for('add_staff') }}" class="btn btn-success">+ Add Staff</a>
  </div>
  <table class="table table-striped align-middle">
    <thead><tr><th>Username</th><th>Email</th></tr></thead>
    <tbody>
      {% for s in staff %}
      <tr><td>{{ s.username }}</td><td>{{ s.email }}</td></tr>
      {% else %}
      <tr><td colspan="2" class="text-muted">No staff yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
