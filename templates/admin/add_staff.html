{% extends 'base.html' %}
{% block title %}Add Staff{% endblock %}
{% block content %}
<div class="container mt-4" style="max-width:560px">
  <h2 class="mb-4">Add Staff Member</h2>
  <form method="POST">
    <div class="mb-3"><label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Email</label>
      <input type="email" name="email" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Temporary password</label>
      <input type="password" name="password" class="form-control" required></div>
    <hr>
    <div class="mb-3"><label class="form-label">Full name</label>
      <input type="text" name="name" class="form-control" required></div>
    <div class="mb-3"><label class="form-label">Contact (optional)</label>
      <input type="text" name="contact" class="form-control"></div>
    <button type="submit" class="btn btn-success">Add Staff</button>
    <a href="{{ url_for('admin_staff') }}" class="btn btn-link">Cancel</a>
  </form>
  <a href='{{ url_for("admin_dashboard") }}' class='btn btn-outline-secondary'> ← Back to dashboard</a>
</div>
{% endblock %}
